<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Color Formats</title>
    <link rel="stylesheet" href="f1.css">
</head>
<body>

    <h1>CSS Color Format</h1>

    
    <div class="box1">
        <h2>Color Name</h2>
        <p>This text uses the color name red.</p>
    </div>

    
    <div class="box2">
        <h2>Hexa Color</h2>
        <p>This text uses hexa color.</p>
    </div>

    
    <div class="box3">
        <h2>RGB Color</h2>
        <p>This text uses RGB color format.</p>
    </div>

    
    <div class="box4">
        <h2>RGBA Color</h2>
        <p>This text uses RGBA color with transparency.</p>
    </div>

    
    <div class="box5">
        <h2>HSL Color</h2>
        <p>This text uses HSL color format.</p>
    </div>

</body>
</html>
